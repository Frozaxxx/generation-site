name: generation-site

services:

  backend:
    build:
      context: ./backend
    container_name: generation-site-backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - TZ=Europe/Berlin
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

  frontend:
    build:
      context: ./frontend
    container_name: generation-site-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  backend-data:

networks:
  default:
    name: generation-site-network
